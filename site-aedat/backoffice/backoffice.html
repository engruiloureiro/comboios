<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light">
<title>Backoffice · Agrupamento de Escolas D. António Taipa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&family=Caveat:wght@700&display=swap">
<style>
:root{
 --navy-950:#0A1B29;--navy-900:#0F2A3E;--navy-800:#17354A;--navy-700:#24506D;--navy-100:#E2EBF2;--navy-50:#F1F6FA;
 --terra-700:#8E3B22;--terra-600:#A64A2C;--terra-100:#F6E5DC;--terra-50:#FBF3EE;
 --paper:#FBF8F3;--sand:#F6EDE1;--line:#ECE4D8;--line-2:#DDD3C4;--ink:#17354A;--ink-2:#3B566A;--ink-3:#566E80;
 --sky:#8CC6EA;--sky-50:#E7F3FB;--sun:#F3C548;--sun-50:#FEF4D3;--orange:#F09A5B;--orange-50:#FDECDD;--lilac:#B7A3DF;--lilac-50:#F1ECFB;--green:#93C77F;--green-50:#E8F4E0;
 --ok:#2F7A4B;--ok-50:#E7F4EC;--err:#B03A2E;--err-50:#FDECEA;--warn:#8A5D10;--warn-50:#FFF6E0;
 --r:14px;--r-sm:10px;--shadow-1:0 1px 2px rgba(23,53,74,.06),0 2px 8px rgba(23,53,74,.05);--shadow-2:0 18px 50px -18px rgba(10,27,41,.45);
 --font-head:Manrope,'Segoe UI',system-ui,sans-serif;--font-body:Inter,'Segoe UI',system-ui,sans-serif;--font-hand:Caveat,'Segoe Print',cursive;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 var(--font-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--terra-600)}
:focus-visible{outline:3px solid var(--navy-700);outline-offset:2px;border-radius:6px}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.crayon{height:5px;background:linear-gradient(90deg,var(--sky) 0 20%,var(--sun) 20% 40%,var(--orange) 40% 60%,var(--lilac) 60% 80%,var(--green) 80%)}

/* entrada */
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(700px 400px at 10% 0,var(--sky-50),transparent 70%),radial-gradient(700px 500px at 100% 100%,var(--terra-50),transparent 70%),var(--paper)}
.login__card{width:min(440px,100%);background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow-2);overflow:hidden}
.login__in{padding:32px 32px 28px}
.login__logo{display:block;width:220px;max-width:100%;height:auto;margin:0 0 18px}
.hand{font-family:var(--font-hand);font-weight:700;font-size:22px;color:var(--terra-600);margin:0}
.login h1{font:800 28px/1.15 var(--font-head);letter-spacing:-.02em;margin:2px 0 6px}
.muted{color:var(--ink-3);font-size:14px}

/* estrutura */
.app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--navy-900);color:#DCE7F0;display:flex;flex-direction:column}
.side__brand{padding:20px 20px 18px;border-bottom:1px solid rgba(255,255,255,.08)}
.side__brand .logo{display:block;background:#fff;border-radius:12px;padding:8px 10px;margin-bottom:14px}
.side__brand .logo img{display:block;width:100%;max-width:200px;height:auto}
.side__title{font:800 17px/1.2 var(--font-head);color:#fff;margin:0}
.side__sub{font-size:12.5px;color:#9FB6C8;margin:2px 0 0}
.side nav{padding:12px 10px;display:flex;flex-direction:column;gap:2px}
.side__kicker{font:700 10.5px/1 var(--font-head);letter-spacing:.14em;text-transform:uppercase;color:#7E9AAF;padding:14px 12px 8px}
.navbtn{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;color:#DCE7F0;text-align:left;padding:10px 12px;border-radius:10px;font-weight:600;font-size:14.5px;position:relative}
.navbtn:hover{background:rgba(255,255,255,.06);color:#fff}
.navbtn[aria-current="page"]{background:rgba(255,255,255,.1);color:#fff}
.navbtn[aria-current="page"]::before{content:"";position:absolute;left:-10px;top:9px;bottom:9px;width:4px;border-radius:0 4px 4px 0;background:var(--sun)}
.navbtn .ic{color:var(--sky)}
.side__foot{margin-top:auto;padding:14px 16px 18px;border-top:1px solid rgba(255,255,255,.08);font-size:12.5px;color:#9FB6C8;display:flex;flex-direction:column;gap:8px}
.side__foot .who{overflow-wrap:anywhere}
.role{display:inline-flex;align-items:center;gap:6px;font:700 11px/1 var(--font-head);letter-spacing:.08em;text-transform:uppercase;padding:5px 9px;border-radius:999px;background:rgba(243,197,72,.16);color:var(--sun);width:max-content}
.ghost{border:1px solid rgba(255,255,255,.18);background:transparent;color:#fff;border-radius:10px;padding:8px 12px;text-align:left;font-weight:600;font-size:13.5px;display:flex;gap:10px;align-items:center;text-decoration:none}
.ghost:hover{background:rgba(255,255,255,.07)}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:5;background:rgba(251,248,243,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top__in{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px clamp(16px,3vw,40px)}
.top h1{font:800 22px/1.2 var(--font-head);letter-spacing:-.015em;margin:0}
.top p{margin:2px 0 0}
.content{padding:24px clamp(16px,3vw,40px) 60px;max-width:1240px;width:100%}

/* componentes */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:8px 16px;border-radius:999px;border:1px solid var(--line-2);background:#fff;font-weight:600;font-size:14px;color:var(--ink);text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--navy-700)}
.btn--pri{background:var(--terra-600);border-color:var(--terra-600);color:#fff}
.btn--pri:hover{background:var(--terra-700);border-color:var(--terra-700)}
.btn--navy{background:var(--navy-800);border-color:var(--navy-800);color:#fff}
.btn--danger{color:var(--err);border-color:#EBC3BE}
.btn--danger:hover{background:var(--err-50);border-color:var(--err)}
.btn--sm{min-height:32px;padding:4px 12px;font-size:13px}
.btn--icon{width:34px;min-height:34px;padding:0}
.btn:disabled{opacity:.55;cursor:not-allowed}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-1)}
.card__head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:16px 20px;border-bottom:1px solid var(--line)}
.card__head h2{font:800 17px/1.2 var(--font-head);margin:0}
.card__body{padding:18px 20px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar .search{flex:1;min-width:220px;max-width:420px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}
.stat{padding:18px 20px;border-radius:var(--r);background:#fff;border:1px solid var(--line);box-shadow:var(--shadow-1);position:relative;overflow:hidden}
.stat::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--c,var(--sky))}
.stat strong{display:block;font:800 30px/1 var(--font-head);letter-spacing:-.02em}
.stat span{display:block;color:var(--ink-3);font-size:13.5px;margin-top:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font:700 11px/1.3 var(--font-head);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);background:var(--paper)}
tbody tr:hover{background:#FDFBF7}
td.title{font-weight:600;max-width:420px}
td.title small{display:block;font-weight:400;color:var(--ink-3)}
.thumb{width:56px;height:42px;border-radius:8px;object-fit:cover;background:var(--sand);display:block}
.badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.b-ok{background:var(--ok-50);color:var(--ok)}.b-off{background:#F0F1F2;color:#5F6B73}.b-warn{background:var(--warn-50);color:var(--warn)}.b-star{background:var(--sun-50);color:#7A5600}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font:700 11px/1.6 var(--font-head);letter-spacing:.06em;text-transform:uppercase}
.tone-terra{background:var(--terra-100);color:var(--terra-700)}.tone-sky{background:var(--sky-50);color:#1D6894}.tone-lilac{background:var(--lilac-50);color:#6145A4}.tone-sun{background:var(--sun-50);color:#7A5600}.tone-green{background:var(--green-50);color:#3A7025}.tone-orange{background:var(--orange-50);color:#A3461A}
.empty{padding:28px;text-align:center;color:var(--ink-3)}
.actions{display:flex;gap:6px;justify-content:flex-end}

/* formulários */
.field{display:block;margin:0 0 14px}
.field>span{display:block;font-weight:600;font-size:13.5px;margin:0 0 6px;color:var(--ink-2)}
.field small{display:block;color:var(--ink-3);font-size:12.5px;margin-top:5px}
.in{display:block;width:100%;min-height:42px;padding:9px 12px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:#fff}
.in:focus{outline:none;border-color:var(--navy-700);box-shadow:0 0 0 3px rgba(36,80,109,.15)}
textarea.in{min-height:84px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.check{display:flex;gap:10px;align-items:flex-start;margin:4px 0 12px;font-size:14px}
.check input{width:18px;height:18px;margin-top:2px;accent-color:var(--terra-600)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches label{position:relative}
.swatches input{position:absolute;opacity:0}
.swatches span{display:inline-block;padding:6px 12px;border-radius:999px;border:2px solid transparent;font-size:12.5px;font-weight:700;cursor:pointer}
.swatches input:checked+span{border-color:var(--navy-800)}
.swatches input:focus-visible+span{outline:3px solid var(--navy-700);outline-offset:2px}
.preview{display:flex;gap:14px;align-items:center;padding:12px;border:1px dashed var(--line-2);border-radius:var(--r-sm);background:var(--paper);margin:-4px 0 14px}
.preview img{width:120px;height:90px;object-fit:cover;border-radius:8px;background:var(--sand)}
.preview .st{font-size:13px}
.st-ok{color:var(--ok)}.st-err{color:var(--err)}
.help{padding:12px 14px;border-radius:var(--r-sm);background:var(--sky-50);color:#174E70;font-size:13.5px;margin:0 0 14px}
.help b{color:#0F3B57}

/* menus */
.menu-block+.menu-block{margin-top:16px}
.item-row{display:grid;grid-template-columns:34px minmax(150px,1.3fr) minmax(150px,1.4fr) 150px auto auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.item-row:last-child{border-bottom:0}
.item-row .in{min-height:38px;padding:7px 10px;font-size:14px}
.ico-prev{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--sky-50);color:#1D6894}
.canal-row{display:grid;grid-template-columns:1fr 1.4fr 1.6fr 140px 150px;gap:10px;align-items:end;padding-bottom:6px;border-bottom:1px solid var(--line);margin-bottom:12px}.canal-row__video{grid-column:1/-1}
.in[aria-invalid=true]{border-color:var(--err);box-shadow:0 0 0 3px rgba(176,58,46,.15);background:var(--err-50)}
.canal-row:last-child{border-bottom:0;margin-bottom:0}
@media (max-width:980px){.canal-row{grid-template-columns:1fr 1fr}}
@media (max-width:760px){.canal-row{grid-template-columns:1fr}}
.mini-checks{display:flex;gap:12px;font-size:12.5px;white-space:nowrap}
.mini-checks label{display:flex;gap:5px;align-items:center}
.mini-checks input{accent-color:var(--terra-600)}
.dirty{box-shadow:inset 4px 0 0 var(--sun)}

/* janela */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:18px;background:rgba(10,27,41,.55);backdrop-filter:blur(3px)}
.modal__box{width:min(780px,100%);max-height:94vh;display:flex;flex-direction:column;background:#fff;border-radius:20px;box-shadow:var(--shadow-2);overflow:hidden}
.modal__head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 22px;border-bottom:1px solid var(--line)}
.modal__head h2{font:800 19px/1.2 var(--font-head);margin:0}
.modal__body{padding:20px 22px;overflow:auto}
.modal__foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:14px 22px;border-top:1px solid var(--line);background:var(--paper)}
.modal__foot .spacer{margin-right:auto}

.toast{position:fixed;right:20px;bottom:20px;z-index:60;max-width:380px;padding:12px 16px;border-radius:12px;background:var(--navy-900);color:#fff;box-shadow:var(--shadow-2);font-size:14px;display:flex;gap:10px;align-items:center}
.toast.err{background:var(--err)}
.alert{padding:12px 14px;border-radius:var(--r-sm);font-size:14px;margin:0 0 14px}
.alert.err{background:var(--err-50);color:var(--err)}
.alert.ok{background:var(--ok-50);color:var(--ok)}
.loading{display:flex;align-items:center;gap:12px;color:var(--ink-3);padding:30px}
.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--terra-600);animation:roda .8s linear infinite}
@keyframes roda{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media (max-width:980px){.stats{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.item-row{grid-template-columns:34px 1fr 1fr;}.item-row .ico-sel,.item-row .mini-checks,.item-row .actions{grid-column:span 1}}
@media (max-width:760px){
 .app{display:block}
 .side{position:relative;height:auto}
 .side nav{flex-direction:row;overflow-x:auto;padding:8px 10px}
 .side__kicker,.side__foot .who,.side__brand .logo{display:none}
 .navbtn{white-space:nowrap;width:auto}
 .navbtn[aria-current="page"]::before{left:10px;right:10px;top:auto;bottom:2px;width:auto;height:3px}
 .side__foot{flex-direction:row;flex-wrap:wrap;padding:10px 14px}
 .row,.row3{grid-template-columns:1fr}
 .item-row{grid-template-columns:34px 1fr}
 .item-row>*{grid-column:2}.item-row>.ico-prev{grid-column:1;grid-row:1}
 table .hide-sm{display:none}
}
</style>
</head>

/* Converte ligações de partilha do OneDrive/SharePoint numa ligação direta para o ficheiro. */
function siteLigacaoDireta(url) {
  url = String(url || '').trim();
  if (!url) return '';
  try {
    const u = new URL(url, location.href);
    if (/(^|\.)1drv\.ms$|(^|\.)onedrive\.live\.com$/i.test(u.hostname) && !/\/download/i.test(u.pathname)) {
      const b64 = btoa(unescape(encodeURIComponent(url))).replace(/=+$/, '').replace(/\//g, '_').replace(/\+/g, '-');
      return 'https://api.onedrive.com/v1.0/shares/u!' + b64 + '/root/content';
    }
    if (/\.sharepoint\.com$/i.test(u.hostname) && !u.searchParams.has('download')) {
      u.searchParams.set('download', '1');
      return u.href;
    }
    return u.href.startsWith(location.origin) && !/^https?:/i.test(url) ? url : u.href;
  } catch (e) { return url; }
}

/* Identificador de um vídeo do YouTube a partir de qualquer ligação (watch, youtu.be, shorts, embed, live). */
function siteYoutubeId(url) {
  url = String(url || '').trim();
  if (/^[\w-]{11}$/.test(url)) return url;
  const m = url.match(/(?:youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/|v\/))([\w-]{11})/i);
  return m ? m[1] : '';
}
/* O que se mete no leitor: um vídeo (ID) ou uma lista de reprodução / os vídeos de um canal (videoseries). */
function siteYoutubeEmbed(url) {
  url = String(url || '').trim();
  if (!/youtu\.?be|^[\w-]{11}$/i.test(url)) return '';
  const id = siteYoutubeId(url);
  if (id) return id;
  let m = url.match(/[?&]list=([\w-]{10,})/);
  if (m) return 'videoseries?list=' + m[1];
  m = url.match(/youtube\.com\/channel\/UC([\w-]{22})/i);
  if (m) return 'videoseries?list=UU' + m[1];
  return '';
}

function ytLimpo(v) {
  v = String(v || '').trim(); if (!v) return null;
  const m = v.match(/src=["']([^"']+)["']/i); if (m) v = m[1];
  const id = siteYoutubeId(v); if (id) return (/\/shorts\//i.test(v) ? 'https://youtube.com/shorts/' : 'https://youtu.be/') + id;

}

async function iniciar() {
  try {
    if (!window.supabase || !window.supabase.createClient) throw new Error('Não foi possível carregar a biblioteca do Supabase. Verifica a ligação à Internet.');
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
    const { data: { session } } = await sb.auth.getSession();
    if (session && session.user) await entrarComo(session.user); else { S.loading = false; render(); }
  } catch (e) { S.loading = false; S.erro = e.message; render(); }
}
async function entrarComo(user) {
  S.loading = true; render();
  const { data, error } = await sb.from('site_perfis').select('perfil,email').eq('user_id', user.id).maybeSingle();
  if (error || !data) {
    await sb.auth.signOut();

    S.erro = error ? 'Erro ao verificar o perfil: ' + error.message : 'Esta conta não tem acesso ao backoffice. Pede a um administrador que te atribua um perfil.';
    return render();

  S.user = user; S.perfil = data.perfil; S.erro = '';

}

async function carregarTudo() {
  const q = [

    sb.from('site_avisos').select('*').order('ordem').order('inicio', { ascending: false }),

    sb.from('site_menus').select('*').order('ordem'),
    sb.from('site_menu_itens').select('*').order('ordem'),
    sb.from('site_config').select('*'),
    sb.from('site_perfis').select('*').order('email'));
  const r = await Promise.all(q);
  const erro = r.find(x => x.error);
  if (erro) toast('Erro ao carregar dados: ' + erro.error.message + '. Confirma que o SQL de instalação foi executado.', true);
  S.noticias = r[0].data || []; S.avisos = r[1].data || [];

    S.config = Object.fromEntries((r[4].data || []).map(c => [c.chave, c.valor]));

  }
}

function acoesTopo() {
  if (S.view === 'noticias') return '<button class="btn btn--pri" data-a="nova-noticia">+ Nova notícia</button>';
  if (S.view === 'avisos') return '<button class="btn btn--pri" data-a="novo-aviso">+ Novo aviso</button>';

}

function vLogin() {
  return '<div class="login"><div class="login__card"><div class="crayon" aria-hidden="true"></div><div class="login__in">' +
    '<img class="login__logo" src="' + LOGO + '" alt="Logótipo do Agrupamento de Escolas D. António Taipa" width="244" height="73">' +
    '<p class="hand">Backoffice do site</p><h1>Entrar</h1><p class="muted">Acesso reservado a quem gere os conteúdos do site do agrupamento.</p>' +
    (S.erro ? '<div class="alert err" role="alert">' + esc(S.erro) + '</div>' : '') +
    '<form id="login-form"><label class="field"><span>Email</span><input class="in" type="email" id="l-email" autocomplete="username" required></label>' +
    '<label class="field"><span>Palavra-passe</span><input class="in" type="password" id="l-pass" autocomplete="current-password" required></label>' +
    '<button class="btn btn--pri" id="l-btn" type="submit" style="width:100%;min-height:46px">Entrar</button></form></div></div></div>';
}

function estadoNoticia(n) {
  if (!n.publicado) return '<span class="badge b-off">Rascunho</span>';
  if (n.data_publicacao > hoje()) return '<span class="badge b-warn">Agendada</span>';
  return '<span class="badge b-ok">Publicada</span>';
}
function estadoAviso(a) {
  if (!a.publicado) return '<span class="badge b-off">Rascunho</span>';
  if (a.inicio && a.inicio > hoje()) return '<span class="badge b-warn">Agendado</span>';
  if (a.fim && a.fim < hoje()) return '<span class="badge b-off">Expirado</span>';
  return '<span class="badge b-ok">Visível</span>';
}
function naPaginaInicial() {
  const pub = S.noticias.filter(n => n.publicado && n.data_publicacao <= hoje());
  const d = pub.find(n => n.destaque) || pub[0];
  return d ? [d, ...pub.filter(n => n !== d).slice(0, 2)] : [];
}

function vPainel() {
  const pub = S.noticias.filter(n => n.publicado && n.data_publicacao <= hoje()).length;
  const rasc = S.noticias.filter(n => !n.publicado).length;
  const avisosVis = S.avisos.filter(a => a.publicado && (!a.inicio || a.inicio <= hoje()) && (!a.fim || a.fim >= hoje())).length;
  const home = naPaginaInicial();
  return '<div class="stats">' +
    [[pub, 'Notícias publicadas', 'var(--terra-600)'], [rasc, 'Rascunhos de notícias', 'var(--sun)'], [avisosVis, 'Avisos visíveis', 'var(--sky)'], [isAdmin() ? S.perfis.length : '—', 'Utilizadores com perfil', 'var(--green)']]
      .map(s => '<div class="stat" style="--c:' + s[2] + '"><strong>' + s[0] + '</strong><span>' + s[1] + '</span></div>').join('') + '</div>' +
    '<div class="grid2"><section class="card"><div class="card__head"><h2>Na página inicial agora</h2><button class="btn btn--sm" data-a="view" data-v="noticias">Gerir notícias</button></div><div class="card__body">' +
    (home.length ? '<ol style="margin:0;padding-left:20px">' + home.map((n, i) => '<li style="margin:0 0 8px"><b>' + esc(n.titulo) + '</b>' + (i === 0 ? ' <span class="badge b-star">Destaque</span>' : '') + '<br><span class="muted">' + esc(n.categoria || '') + ' · ' + dataPT(n.data_publicacao) + '</span></li>').join('') + '</ol>' : '<p class="muted">Ainda não há notícias publicadas. A página mostra o conteúdo de exemplo.</p>') +
    '</div></section><section class="card"><div class="card__head"><h2>Informação útil visível</h2><button class="btn btn--sm" data-a="view" data-v="avisos">Gerir avisos</button></div><div class="card__body">' +
    (avisosVis ? '<ul style="margin:0;padding-left:20px">' + S.avisos.filter(a => a.publicado && (!a.inicio || a.inicio <= hoje()) && (!a.fim || a.fim >= hoje())).slice(0, 6).map(a => '<li style="margin:0 0 8px"><span class="muted" style="font-size:12px;font-weight:700;letter-spacing:.06em">' + esc(a.publico) + '</span><br>' + esc(a.titulo) + '</li>').join('') + '</ul>' : '<p class="muted">Não há avisos visíveis.</p>') +
    '</div></section></div>' +
    '<div class="help" style="margin-top:18px"><b>Imagens e documentos:</b> ficam no OneDrive do agrupamento. No OneDrive, escolhe <b>Partilhar → Qualquer pessoa com a ligação pode ver</b>, copia a ligação e cola-a no campo da imagem ou da ligação. O backoffice converte-a numa ligação direta e mostra a pré-visualização.</div>';
}

function filtrar(lista, campos) {
  const q = S.filtro.toLowerCase();
  return q ? lista.filter(x => campos.some(c => String(x[c] || '').toLowerCase().includes(q))) : lista;
}
function vNoticias() {
  const lista = filtrar(S.noticias, ['titulo', 'categoria', 'resumo']);
  const home = naPaginaInicial();
  return '<div class="toolbar"><input class="in search" id="filtro" type="search" placeholder="Pesquisar por título ou categoria…" value="' + esc(S.filtro) + '" aria-label="Pesquisar notícias"></div>' +
    '<div class="card table-wrap"><table><thead><tr><th class="hide-sm">Imagem</th><th>Notícia</th><th class="hide-sm">Data</th><th>Estado</th><th><span class="sr-only">Ações</span></th></tr></thead><tbody>' +
    (lista.length ? lista.map(n => '<tr><td class="hide-sm">' + (n.imagem_url ? '<img class="thumb" src="' + esc(siteLigacaoDireta(n.imagem_url)) + '" alt="">' : (siteYoutubeId(n.video_url) ? '<img class="thumb" src="https://i.ytimg.com/vi/' + siteYoutubeId(n.video_url) + '/default.jpg" alt="">' : '<span class="thumb"></span>')) + '</td>' +
      '<td class="title">' + (n.categoria ? '<span class="tag tone-' + esc(n.cor) + '">' + esc(n.categoria) + '</span><br>' : '') + esc(n.titulo) + (siteYoutubeId(n.video_url) ? ' <span class="badge b-warn">Vídeo</span>' : '') + (home[0] === n ? ' <span class="badge b-star">Destaque</span>' : home.includes(n) ? ' <span class="badge b-ok">Na página inicial</span>' : '') + '<small>' + esc(n.resumo || '') + '</small></td>' +
      '<td class="hide-sm">' + dataPT(n.data_publicacao) + '</td><td>' + estadoNoticia(n) + '</td>' +
      '<td><div class="actions"><button class="btn btn--sm" data-a="editar-noticia" data-id="' + n.id + '">Editar</button></div></td></tr>').join('')
      : '<tr><td colspan="5" class="empty">' + (S.filtro ? 'Nenhuma notícia corresponde à pesquisa.' : 'Ainda não existem notícias. Cria a primeira com “Nova notícia”.') + '</td></tr>') +
    '</tbody></table></div>';
}
function vAvisos() {
  const lista = filtrar(S.avisos, ['titulo', 'publico']);
  return '<div class="toolbar"><input class="in search" id="filtro" type="search" placeholder="Pesquisar avisos…" value="' + esc(S.filtro) + '" aria-label="Pesquisar avisos"></div>' +
    '<div class="card table-wrap"><table><thead><tr><th>Aviso</th><th class="hide-sm">Período</th><th class="hide-sm">Ordem</th><th>Estado</th><th><span class="sr-only">Ações</span></th></tr></thead><tbody>' +
    (lista.length ? lista.map(a => '<tr><td class="title"><small style="font-weight:700;letter-spacing:.06em">' + esc(a.publico) + '</small>' + esc(a.titulo) + '</td>' +
      '<td class="hide-sm">' + (a.inicio || a.fim ? dataPT(a.inicio) + ' a ' + dataPT(a.fim) : 'Sempre') + '</td><td class="hide-sm">' + a.ordem + '</td><td>' + estadoAviso(a) + '</td>' +
      '<td><div class="actions"><button class="btn btn--sm" data-a="editar-aviso" data-id="' + a.id + '">Editar</button></div></td></tr>').join('')
      : '<tr><td colspan="5" class="empty">' + (S.filtro ? 'Nenhum aviso corresponde à pesquisa.' : 'Ainda não existem avisos.') + '</td></tr>') +
    '</tbody></table></div>';
}

/* ---- menus: edição local por menu, gravada de uma vez */
const rascunhoMenus = {};
function itensDoMenu(chave) {
  if (!rascunhoMenus[chave]) rascunhoMenus[chave] = { rotulo: (S.menus.find(m => m.chave === chave) || {}).rotulo || '', itens: S.itens.filter(i => i.menu === chave).map(i => ({ ...i })), apagados: [], sujo: false };
  return rascunhoMenus[chave];
}
function icoSelect(id, atual) {
  return '<select class="in ico-sel" id="' + id + '" aria-label="Ícone">' + MENUS_ICONES.map(i => '<option value="' + i + '"' + (i === atual ? ' selected' : '') + '>' + i.slice(2) + '</option>').join('') + '</select>';
}

      const r = itensDoMenu(m.chave);
      return '<section class="card menu-block' + (r.sujo ? ' dirty' : '') + '" data-menu-block="' + m.chave + '"><div class="card__head"><label class="field" style="margin:0;flex:1;min-width:220px;max-width:360px"><span>Nome do menu</span><input class="in" data-menu-rotulo="' + m.chave + '" value="' + esc(r.rotulo) + '"></label>' +
        '<div class="actions">' + (r.sujo ? '<span class="badge b-warn">Alterações por guardar</span>' : '') + '<button class="btn btn--sm" data-a="item-novo" data-v="' + m.chave + '">+ Entrada</button><button class="btn btn--sm btn--navy" data-a="menu-guardar" data-v="' + m.chave + '"' + (r.sujo ? '' : ' disabled') + '>Guardar menu</button></div></div><div class="card__body">' +
        (r.itens.length ? r.itens.map((it, i) => '<div class="item-row" data-k="' + m.chave + '" data-i="' + i + '"><span class="ico-prev">' + ico(it.icone) + '</span>' +
          '<input class="in" data-f="rotulo" value="' + esc(it.rotulo) + '" aria-label="Nome da entrada" placeholder="Nome da entrada">' +
          '<input class="in" data-f="url" value="' + esc(it.url === '#' ? '' : it.url) + '" aria-label="Ligação" placeholder="Ligação (https://… ou OneDrive)">' +

          '<span class="mini-checks"><label><input type="checkbox" data-f="visivel"' + (it.visivel ? ' checked' : '') + '>Visível</label><label><input type="checkbox" data-f="nova_aba"' + (it.nova_aba ? ' checked' : '') + '>Nova aba</label></span>' +

        '</div></section>';
    }).join('');

      '<div class="row"><label class="field"><span>Data de publicação</span><input class="in" type="date" id="n-data" value="' + esc(n.data_publicacao || hoje()) + '"><small>Com data futura, a notícia só aparece nesse dia.</small></label>' +
      '<div class="field"><span>Publicação</span><label class="check"><input type="checkbox" id="n-pub"' + (n.publicado ? ' checked' : '') + '>Publicada no site</label><label class="check"><input type="checkbox" id="n-dest"' + (n.destaque ? ' checked' : '') + '>Notícia em destaque (a grande, na página inicial)</label><label class="check"><input type="checkbox" id="n-en"' + (n.idioma === 'en' ? ' checked' : '') + '>Título e resumo em inglês</label></div></div></form>';
    pe = (n.id ? '<button class="btn btn--danger spacer" data-a="apagar-noticia">Apagar</button>' : '') + '<button class="btn" data-a="fechar">Cancelar</button><button class="btn btn--pri" type="submit" form="modal-form">Guardar</button>';
  } else if (m.tipo === 'aviso') {
    const a = m.dados;
    titulo = a.id ? 'Editar aviso' : 'Novo aviso';
    corpo = '<form id="modal-form"><label class="field"><span>Público-alvo</span><input class="in" id="v-publico" list="publicos" value="' + esc(a.publico || PUBLICOS[0]) + '"><datalist id="publicos">' + PUBLICOS.map(p => '<option value="' + p + '">').join('') + '</datalist><small>O ícone e a cor do aviso dependem do público (alunos/famílias, comunidade, docentes).</small></label>' +
      '<label class="field"><span>Título *</span><input class="in" id="v-titulo" required value="' + esc(a.titulo) + '" data-autofocus></label>' +
      '<label class="field"><span>Ligação (opcional)</span><input class="in" id="v-url" value="' + esc(a.ligacao_url) + '" placeholder="Página ou documento no OneDrive"></label>' +
      '<div class="row3"><label class="field"><span>Mostrar a partir de</span><input class="in" type="date" id="v-inicio" value="' + esc(a.inicio) + '"></label><label class="field"><span>Mostrar até</span><input class="in" type="date" id="v-fim" value="' + esc(a.fim) + '"></label><label class="field"><span>Ordem</span><input class="in" type="number" id="v-ordem" value="' + esc(a.ordem == null ? (S.avisos.length + 1) * 10 : a.ordem) + '"><small>Menor aparece primeiro.</small></label></div>' +
      '<label class="check"><input type="checkbox" id="v-pub"' + (a.publicado ? ' checked' : '') + '>Publicado no site</label></form>';
    pe = (a.id ? '<button class="btn btn--danger spacer" data-a="apagar-aviso">Apagar</button>' : '') + '<button class="btn" data-a="fechar">Cancelar</button><button class="btn btn--pri" type="submit" form="modal-form">Guardar</button>';
  }
  return '<div class="modal" data-overlay="1"><div class="modal__box" role="dialog" aria-modal="true" aria-labelledby="modal-t"><div class="modal__head"><h2 id="modal-t">' + titulo + '</h2><button class="btn btn--icon" data-a="fechar" aria-label="Fechar">×</button></div><div class="modal__body">' + corpo + '</div><div class="modal__foot">' + pe + '</div></div></div>';
}

/* pré-visualização das imagens do OneDrive */
function verificarImagem(input) {
  const box = document.getElementById(input.dataset.preview); if (!box) return;
  const url = input.value.trim();
  box.hidden = !url; if (!url) return;
  const img = box.querySelector('img'), st = box.querySelector('.st');
  st.className = 'st'; st.textContent = 'A verificar a imagem…';
  img.onload = () => { st.className = 'st st-ok'; st.textContent = 'Imagem encontrada (' + img.naturalWidth + '×' + img.naturalHeight + ').'; };
  img.onerror = () => { st.className = 'st st-err'; st.textContent = 'Não foi possível abrir a imagem. Confirma que a partilha é “Qualquer pessoa com a ligação” e que a ligação é de um ficheiro de imagem.'; };
  img.src = siteLigacaoDireta(url);
}

/* ------------------------------------------------------------------ gravação */
async function guardarNoticia() {
  const n = S.modal.dados;
  const d = { titulo: val('n-titulo'), resumo: val('n-resumo') || null, categoria: val('n-categoria') || null, cor: (document.querySelector('input[name="n-cor"]:checked') || {}).value || 'terra',
    imagem_url: val('n-img') || null, imagem_alt: val('n-alt') || null, imagem_topo: chk('n-topo'), video_url: ytLimpo(val('n-video')), ligacao_url: val('n-url') || null, ligacao_texto: val('n-ltexto') || 'Ver a notícia',
    data_publicacao: val('n-data') || hoje(), publicado: chk('n-pub'), destaque: chk('n-dest'), idioma: chk('n-en') ? 'en' : null };
  if (!d.titulo) return toast('Indica o título da notícia.', true);
  if (d.video_url && !siteYoutubeId(d.video_url)) return toast('A ligação do vídeo não parece ser do YouTube. Copia-a em Partilhar → Copiar no YouTube.', true);
  if (d.imagem_url && !d.imagem_alt) return toast('Descreve a imagem (texto alternativo) para quem usa leitores de ecrã.', true);
  try {
    if (d.destaque) { const r = await sb.from('site_noticias').update({ destaque: false }).eq('destaque', true).neq('id', n.id || '00000000-0000-0000-0000-000000000000'); if (r.error) throw r.error; }
    const r = n.id ? await sb.from('site_noticias').update(d).eq('id', n.id) : await sb.from('site_noticias').insert(d);
    if (r.error) throw r.error;
    S.modal = null; await carregarTudo(); render(); toast('Notícia guardada.');
  } catch (e) { falha(e, 'guardar a notícia'); }
}
async function apagar(tabela, id, nome) {
  if (!confirm('Apagar definitivamente ' + nome + '?')) return;
  const r = await sb.from(tabela).delete().eq('id', id);
  if (r.error) return falha(r.error, 'apagar');
  S.modal = null; await carregarTudo(); render(); toast('Apagado.');
}
async function guardarAviso() {
  const a = S.modal.dados;
  const d = { publico: (val('v-publico') || PUBLICOS[0]).toUpperCase(), titulo: val('v-titulo'), ligacao_url: val('v-url') || null, inicio: val('v-inicio') || null, fim: val('v-fim') || null, ordem: parseInt(val('v-ordem'), 10) || 0, publicado: chk('v-pub') };
  if (!d.titulo) return toast('Indica o título do aviso.', true);
  if (d.inicio && d.fim && d.fim < d.inicio) return toast('A data final não pode ser anterior à inicial.', true);
  const r = a.id ? await sb.from('site_avisos').update(d).eq('id', a.id) : await sb.from('site_avisos').insert(d);
  if (r.error) return falha(r.error, 'guardar o aviso');
  S.modal = null; await carregarTudo(); render(); toast('Aviso guardado.');
}
async function guardarMenu(chave) {
  const r = itensDoMenu(chave);
  if (!r.rotulo.trim()) return toast('O menu precisa de um nome.', true);
  if (r.itens.some(i => !i.rotulo.trim())) return toast('Todas as entradas precisam de nome.', true);
  try {
    let x = await sb.from('site_menus').update({ rotulo: r.rotulo.trim() }).eq('chave', chave); if (x.error) throw x.error;
    if (r.apagados.length) { x = await sb.from('site_menu_itens').delete().in('id', r.apagados); if (x.error) throw x.error; }
    const linhas = r.itens.map((i, k) => { const l = { menu: chave, rotulo: i.rotulo.trim(), url: (i.url || '').trim() || '#', icone: i.icone || 'i-link', ordem: (k + 1) * 10, visivel: !!i.visivel, nova_aba: !!i.nova_aba }; if (i.id) l.id = i.id; return l; });
    const novas = linhas.filter(l => !l.id), existentes = linhas.filter(l => l.id);
    if (existentes.length) { x = await sb.from('site_menu_itens').upsert(existentes); if (x.error) throw x.error; }
    if (novas.length) { x = await sb.from('site_menu_itens').insert(novas); if (x.error) throw x.error; }
    delete rascunhoMenus[chave]; await carregarTudo(); render(); toast('Menu “' + r.rotulo.trim() + '” guardado.');
  } catch (e) { falha(e, 'guardar o menu'); }
}
async function guardarDestaque() {
  const destaque = { eyebrow: val('d-eyebrow'), palavras: [val('d-p0'), val('d-p1'), val('d-p2')], intro: val('d-intro'), percurso_eyebrow: val('d-pe'), percurso_titulo: val('d-pt'), percurso_texto: val('d-px'), percurso_botao: val('d-pb'), imagem_url: val('d-img') || null };
  const acessos = [0, 1, 2, 3].map(i => ({ rotulo: val('a-r' + i), url: val('a-u' + i) || '#', icone: val('a-i' + i) })).filter(a => a.rotulo);
  if (destaque.palavras.some(p => !p)) return toast('Preenche as três palavras do título.', true);
  const canais = [0, 1, 2, 3].map(i => ({ rotulo: val('c-r' + i), descricao: val('c-d' + i), url: val('c-u' + i) || '#', icone: val('c-i' + i), cor: val('c-c' + i), video_url: ytLimpo(val('c-v' + i)) })).filter(c => c.rotulo);
  document.querySelectorAll('[id^="c-v"]').forEach(el => el.removeAttribute('aria-invalid'));
  const iMau = [0, 1, 2, 3].find(i => val('c-r' + i) && val('c-v' + i) && !siteYoutubeEmbed(ytLimpo(val('c-v' + i))));
  if (iMau !== undefined) {
    const el = document.getElementById('c-v' + iMau);
    el.setAttribute('aria-invalid', 'true'); el.focus(); el.scrollIntoView({ block: 'center' });
    const v = val('c-v' + iMau), nome = 'Canal ' + (iMau + 1) + ' (“' + val('c-r' + iMau) + '”)';
    if (/youtube\.com\/(@|c\/|user\/)/i.test(v)) return toast(nome + ': “' + v + '” é a ligação do canal, não de um vídeo. Põe-na no campo Ligação; no Vídeo em destaque cola um vídeo ou Short (Partilhar → Copiar), ou deixa vazio.', true);
    return toast(nome + ': o vídeo em destaque tem “' + v + '”, que não é um vídeo do YouTube. Cola a ligação ou o código de incorporação (<iframe>) de um vídeo, Short ou lista, ou deixa o campo vazio.', true);
  }
  const r = await sb.from('site_config').upsert([{ chave: 'destaque', valor: destaque }, { chave: 'acessos', valor: acessos }, { chave: 'canais', valor: canais }]);
  if (r.error) return falha(r.error, 'guardar o destaque');
  await carregarTudo(); render(); toast('Destaque, acessos e canais guardados.');
}
async function definirPerfil(email, perfil) {
  const r = await sb.rpc('site_definir_perfil', { p_email: email, p_perfil: perfil });
  if (r.error) return falha(r.error, 'alterar o perfil');
  await carregarTudo(); render(); toast(perfil ? 'Perfil atribuído a ' + email + '.' : 'Acesso retirado a ' + email + '.');
}

/* ------------------------------------------------------------------ eventos */
document.addEventListener('submit', e => {
  const id = e.target.id;
  if (id === 'login-form') return login(e);
  e.preventDefault();
  if (id === 'modal-form') return S.modal.tipo === 'noticia' ? guardarNoticia() : guardarAviso();
  if (id === 'destaque-form') return guardarDestaque();
  if (id === 'perfil-form') return definirPerfil(val('p-email'), val('p-perfil'));
});
document.addEventListener('click', e => {
  if (e.target.dataset && e.target.dataset.overlay) { S.modal = null; return render(); }
  const b = e.target.closest('[data-a]'); if (!b) return;
  const a = b.dataset.a, v = b.dataset.v;
  if (a === 'view') { S.view = v; S.filtro = ''; render(); window.scrollTo(0, 0); }
  else if (a === 'sair') sair();
  else if (a === 'recarregar') { Object.keys(rascunhoMenus).forEach(k => delete rascunhoMenus[k]); carregarTudo().then(() => { render(); toast('Dados atualizados.'); }); }
  else if (a === 'fechar') { S.modal = null; render(); }
  else if (a === 'nova-noticia') { S.modal = { tipo: 'noticia', dados: { publicado: true, cor: 'terra', data_publicacao: hoje() } }; render(); }
  else if (a === 'editar-noticia') { S.modal = { tipo: 'noticia', dados: { ...S.noticias.find(n => n.id === b.dataset.id) } }; render(); document.querySelectorAll('[data-preview]').forEach(verificarImagem); }
  else if (a === 'apagar-noticia') apagar('site_noticias', S.modal.dados.id, 'a notícia “' + S.modal.dados.titulo + '”');
  else if (a === 'novo-aviso') { S.modal = { tipo: 'aviso', dados: { publicado: true } }; render(); }
  else if (a === 'editar-aviso') { S.modal = { tipo: 'aviso', dados: { ...S.avisos.find(x => x.id === b.dataset.id) } }; render(); }
  else if (a === 'apagar-aviso') apagar('site_avisos', S.modal.dados.id, 'o aviso “' + S.modal.dados.titulo + '”');
  else if (a === 'menu-guardar') guardarMenu(v);
  else if (a === 'item-novo') { const r = itensDoMenu(v); r.itens.push({ rotulo: '', url: '', icone: 'i-link', visivel: true, nova_aba: false }); r.sujo = true; render(); const rows = document.querySelectorAll('[data-menu-block="' + v + '"] .item-row input[data-f="rotulo"]'); if (rows.length) rows[rows.length - 1].focus(); }
  else if (/^item-/.test(a)) {
    const row = b.closest('.item-row'); const r = itensDoMenu(row.dataset.k); const i = +row.dataset.i;
    if (a === 'item-apagar') { const [x] = r.itens.splice(i, 1); if (x.id) r.apagados.push(x.id); }
    if (a === 'item-subir' && i > 0) [r.itens[i - 1], r.itens[i]] = [r.itens[i], r.itens[i - 1]];
    if (a === 'item-descer' && i < r.itens.length - 1) [r.itens[i + 1], r.itens[i]] = [r.itens[i], r.itens[i + 1]];
    r.sujo = true; render();
  }
  else if (a === 'perfil-remover') { if (confirm('Retirar o acesso ao backoffice a ' + v + '?')) definirPerfil(v, null); }
});
function marcarSujo(chave) {
  const r = itensDoMenu(chave); if (r.sujo) return;
  r.sujo = true;
  const bl = document.querySelector('[data-menu-block="' + chave + '"]');
  if (bl) { bl.classList.add('dirty'); const g = bl.querySelector('[data-a="menu-guardar"]'); if (g) g.disabled = false; }
}
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'filtro') { S.filtro = t.value; const pos = t.selectionStart; render(); const f = $('#filtro'); f.focus(); f.setSelectionRange(pos, pos); return; }
  if (t.dataset.menuRotulo) { itensDoMenu(t.dataset.menuRotulo).rotulo = t.value; marcarSujo(t.dataset.menuRotulo); return; }
  const row = t.closest && t.closest('.item-row');
  if (row && t.dataset.f) {
    const it = itensDoMenu(row.dataset.k).itens[+row.dataset.i];
    it[t.dataset.f] = t.type === 'checkbox' ? t.checked : t.value;
    if (t.dataset.f === 'icone') row.querySelector('.ico-prev').innerHTML = ico(t.value);
    marcarSujo(row.dataset.k);
  }
});
function verificarVideo(input) {
  const box = document.getElementById(input.dataset.ytPreview); if (!box) return;
  const url = input.value.trim(), id = siteYoutubeId(url);
  box.hidden = !url; if (!url) return;
  const img = box.querySelector('img'), st = box.querySelector('.st');
  if (!id) { img.removeAttribute('src'); st.className = 'st st-err'; st.textContent = 'Esta ligação não é de um vídeo do YouTube.'; return; }
  img.src = 'https://i.ytimg.com/vi/' + id + '/hqdefault.jpg';
  st.className = 'st st-ok'; st.textContent = 'Vídeo reconhecido. No site aparece a miniatura com o botão de reprodução.';
}
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset && t.dataset.ytPreview) verificarVideo(t);
  if (t.dataset && t.dataset.preview) verificarImagem(t);
  if (t.dataset && t.dataset.perfilEmail) definirPerfil(t.dataset.perfilEmail, t.value);
  const row = t.closest && t.closest('.item-row');
  if (row && t.type === 'checkbox') { itensDoMenu(row.dataset.k).itens[+row.dataset.i][t.dataset.f] = t.checked; marcarSujo(row.dataset.k); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.modal) { S.modal = null; render(); } });
window.addEventListener('beforeunload', e => { if (Object.values(rascunhoMenus).some(r => r.sujo)) { e.preventDefault(); e.returnValue = ''; } });
iniciar();
</script>
</body>
</html>
